spring.application.name=safety

#Docker
#spring.datasource.url=jdbc:mysql://localhost:3307/womenSafety
#spring.datasource.username=user
#spring.datasource.password=password

#MySQLWorkbench
spring.datasource.url=jdbc:mysql://localhost:3306/womenSafety
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret.key=

#mailhog
#spring.mail.host=localhost
#spring.mail.port=1025
#spring.mail.properties.mail.smtp.auth=false

#actual email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# twilio (for SMS) - set real values in prod as env vars
twilio.account.sid=
twilio.auth.token=
twilio.phone.number=
sms.enabled=true


# File Upload Configuration
#file.upload.dir=uploads/emergency-media
#file.max.size=10485760
# 10MB limit

## Switch to R2 mode
storage.mode=R2

## Add your R2 credentials
cloudflare.r2.account-id=YOUR_ACCOUNT_ID
cloudflare.r2.access-key=YOUR_ACCESS_KEY
cloudflare.r2.secret-key=YOUR_SECRET_KEY
cloudflare.r2.bucket-name=women-safety-media
cloudflare.r2.endpoint=

# Multipart Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2MB

# App Base URL (for generating media URLs)
app.base.url=http://localhost:8080
